name: Refresh data

# Cloudflare builds the site (collect + vite build) when this hook fires.
# GitHub compute for this workflow is ~10 seconds — the heavy lifting runs on Cloudflare.
#
# Setup (one time):
#   1. Cloudflare Dashboard → Workers & Pages → job-terminal → Settings → Builds & deployments
#      Build command:  npm run build:data
#      Build output:   dist
#   2. Settings → Builds & deployments → Deploy hooks → create a hook (branch: main)
#   3. GitHub repo → Settings → Secrets → Actions → add secret
#      CLOUDFLARE_DEPLOY_HOOK = <deploy hook URL>

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Cloudflare Pages rebuild
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK secret not set — skipping. See README."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"
          echo "Cloudflare rebuild triggered."

name: Refresh data

# Rebuilds the data snapshot and deploys the Worker (static assets) 3x per day.
# For Workers, the deploy itself must upload fresh assets, so this workflow runs
# the ~3s collector + vite build + `wrangler deploy` (~1-2 min total on GitHub).
#
# Setup (one time):
#   1. Create a Cloudflare API token (My Profile → API Tokens) with:
#        Account: Workers Scripts (edit)
#      and copy your Account ID (Workers & Pages → Overview, right sidebar).
#   2. GitHub repo → Settings → Secrets and variables → Actions:
#        CLOUDFLARE_API_TOKEN  = <token>
#        CLOUDFLARE_ACCOUNT_ID = <account id>
#   3. Optional repository variable (Settings → Secrets and variables → Actions → Variables):
#        SNAPSHOT_URL = https://job-terminal.<your-subdomain>.workers.dev
#      Lets each CI run merge fresh data with the live snapshot so a source
#      outage never drops listings between deploys.

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect data snapshot
        env:
          SNAPSHOT_URL: ${{ vars.SNAPSHOT_URL }}
        run: npm run collect

      - run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy. See README."
            exit 0
          fi
          CLOUDFLARE_API_TOKEN="$CF_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" npx -y wrangler deploy
